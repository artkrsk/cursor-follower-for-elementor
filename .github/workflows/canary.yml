name: Weekly Canary

on:
  schedule:
    # Monday 03:00 UTC — before the workweek, after the weekend's releases.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    uses: artkrsk/wordpress-plugin-workflows/.github/workflows/canary.yml@e6a2fdf517588bf09377a052a59709f152316244 # main
    with:
      integration_suites: '[]'
