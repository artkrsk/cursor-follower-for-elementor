name: Deploy VitePress Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      # The demo pages import the engine and its styles directly (@engine,
      # @styles), so an engine-only change would otherwise leave the site stale.
      - 'src/ts/**'
      - 'src/styles/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-docs:
    uses: artkrsk/wordpress-plugin-workflows/.github/workflows/deploy-docs.yml@main
    with:
      runner: self-hosted
      docs_base_path: /cursor-follower-for-elementor/
