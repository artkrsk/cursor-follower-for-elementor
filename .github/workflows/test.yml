name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Supersede in-flight runs for the same ref so pushes don't pile up on the
# single self-hosted runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: artkrsk/wordpress-plugin-workflows/.github/workflows/test.yml@ae4342eb9ff95a915392723659526c21f94b5b94 # main
    with:
      zip_budget_mb: '0.25'
      coverage: true
      blueprint_check: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
