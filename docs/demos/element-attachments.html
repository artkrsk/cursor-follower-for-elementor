<div class="element-home-examples">
  <button class="element-home-card no-cursor-target" type="button">
    Centered — click to hide
    <span class="element-badge element-badge_center">Play</span>
  </button>
  <button class="element-home-card no-cursor-target" type="button">
    Corner — click to hide
    <span class="element-badge element-badge_corner">View</span>
  </button>
  <button class="element-home-card element-home-card_flow no-cursor-target" type="button">
    Normal flow — click to hide
    <span class="element-badge">Explore</span>
    <span>This text keeps its place.</span>
  </button>
</div>
<button class="element-restore" type="button">Show all at home</button>
<section class="element-preview-example" data-selection="distance">
  <h3>Distance-based image switching</h3>
  <p>Move over a row. Travel farther to select the next image.</p>
  <button class="element-preview-row no-cursor-target" type="button">Courtyard House</button>
  <button class="element-preview-row no-cursor-target" type="button">Garden Pavilion</button>
  <div class="element-preview"><div class="element-preview-content"></div></div>
</section>
<section class="element-preview-example" data-selection="scrub">
  <h3>Position-based scrubbing and custom reveal</h3>
  <p>Move left to right to select an image. Both rows share one preview.</p>
  <button class="element-preview-row no-cursor-target" type="button">Concrete Study</button>
  <button class="element-preview-row no-cursor-target" type="button">Timber Study</button>
  <div class="element-preview"><div class="element-preview-content"></div></div>
</section>
